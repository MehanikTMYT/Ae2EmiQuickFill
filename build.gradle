plugins {
    id 'java-library'
    // 2.0.141 — последняя moddev, проверенная флотом на 26.1.2 + Gradle 9.2.1 (см. AE-Compendium)
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

base {
    // 产物名带游戏版本：ae2_emi_quick_fill-26.1.2-1.0.1+neoforge.26.1.2-port.1.jar
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
}

neoForge {
    version = neo_version

    mods {
        create(mod_id) {
            sourceSet sourceSets.main
        }
    }

    // Fleet QA: .port-tools/qa_server.sh запускает `./gradlew runServer`.
    // Мод client-only и на выделенном сервере не грузится — server-ран нужен только для smoke:
    // валидность toml/pack.mcmeta/mixin-конфига и старт мира без падения загрузчика.
    // DSL moddev 2.0.141: gameDirectory/sourceSet/programArgument (НЕ workingDirectory/modSource из NG7).
    runs {
        configureEach { sourceSet = sourceSets.main }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'org.appliedenergistics'
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // AE2 26.1-линейки из mavenLocal: EMI-интеграция вернулась в appeng.client.integrations.emi
    // (в 26.1.12-beta её не было, в 26.1.12-SNAPSHOT — есть; см. PORTING.md)
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"

    // EMI из mavenLocal (fleet-сборка dev.emi:emi-neoforge): api-классификатор для компиляции,
    // полный jar в localRuntime для дев-запусков. libs/ больше не нужен.
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    localRuntime "dev.emi:emi-neoforge:${emi_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

processResources {
    def replaceProperties = [
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_version          : mod_version,
            mod_group_id         : mod_group_id,
            mod_authors          : mod_authors,
            mod_license          : mod_license,
            mod_description      : mod_description,
            minecraft_version_range: minecraft_version_range,
            neo_version_range    : neo_version_range,
            loader_version_range : loader_version_range
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        filteringCharset = 'UTF-8'
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : mod_authors
        ])
    }
}
