modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}'''
logoFile = "icon.png"
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "ae2_emi_quick_fill.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ae2"
type = "required"
versionRange = "[26.1,)"
ordering = "AFTER"
# CLIENT, не BOTH: мод патчит только клиентские EMI-хендлеры AE2. FML проверяет
# обязательные зависимости ДО dist-фильтра @Mod(CLIENT), поэтому side="BOTH"
# ронял бы выделенный сервер без AE2 (см. smoke aqf-smoke 2026-11-06).
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "emi"
type = "required"
versionRange = "[1.1.18,)"
ordering = "AFTER"
side = "CLIENT"
